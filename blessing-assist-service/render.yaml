# Render Blueprint — one-click deploy of the Flask service.
#
# Render reads this file from the repo and creates the service with these
# settings. The only thing it cannot know is the API key, which you paste
# into the dashboard once (sync: false below means "ask me, do not store
# this in git").
#
# Free tier note: the instance sleeps after ~15 minutes idle and takes
# 30–50s to wake. Next.js waits 20s and then falls back to Claude, so a
# guest never sees an error — but the first request after a quiet spell
# will not go through Python. The Starter plan (~$7/mo) keeps it awake.
services:
  - type: web
    name: wedding-tales-blessing-assist
    runtime: python
    rootDir: blessing-assist-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: PYTHON_VERSION
        value: "3.12"
